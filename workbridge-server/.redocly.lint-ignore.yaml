# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
openapi.json:
  operation-4xx-response:
    - '#/paths/~1health/get/responses'
    - '#/paths/~1api~1auth~1google/get/responses'
    - '#/paths/~1api~1auth~1google~1callback/get/responses'
    - '#/paths/~1api~1users~1{id}~1reviews/get/responses'
    - '#/paths/~1api~1reviews~1users~1{id}/get/responses'
  operation-2xx-response:
    - '#/paths/~1api~1auth~1google/get/responses'
    - '#/paths/~1api~1auth~1google~1callback/get/responses'
    - '#/paths/~1api~1contracts~1{id}/patch/responses'

# PR마다 Claude가 REVIEW.md의 기준으로 코드 리뷰를 하고 인라인 코멘트를 남긴다.
# 드래프트 PR은 건너뛴다. 리뷰는 PR을 승인하거나 막지 않는다 — 머지 결정은 사람이 한다.
name: claude-code-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이 PR을 코드 리뷰한다: ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            1. 먼저 `REVIEW.md`와 `CLAUDE.md`를 읽는다. `REVIEW.md`의 번호 항목이 이 저장소의 리뷰 기준이고,
               변경한 파일 경로에 해당하는 `.claude/rules/*.md`도 읽는다.
            2. `gh pr diff ${{ github.event.pull_request.number }}`로 변경 사항을 읽고, 필요한 만큼 주변 코드를 본다.
            3. 지적은 **실제로 틀렸거나 기준을 어긴 것**만 한다. 스타일, 취향, 결과에 영향이 없는 개선은 쓰지 않는다.
               `REVIEW.md` 항목 위반은 반드시 짚고 `REVIEW #n`을 붙인다. 일반 버그는 재현 조건을 적는다.
            4. 지적마다 `mcp__github_inline_comment__create_inline_comment`로 해당 줄에 인라인 코멘트를 단다.
               한국어로, 한 지적에 한 코멘트, 고칠 방향을 한 줄로.
            5. 지적이 하나도 없으면 "리뷰 결과: 지적 없음"이라고 PR 코멘트 하나만 남긴다.
            PR을 승인하거나 요청 변경을 걸지 않는다. 코드를 고치거나 push하지 않는다.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__create_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"

name: ci

on:
  push:
    branches: [main]
  pull_request:

# PR에 푸시가 이어지면 이전 실행을 취소한다. main 푸시는 끝까지 돈다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    name: workbridge-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbridge-server

    # 스위트는 Prisma 클라이언트를 모킹하지 않고 실제 Postgres로 돈다. 스위트가 잡으려는 버그가
    # 외래 키, 유니크 제약, 트랜잭션 롤백 같은 DB 동작이라서, 모킹하면 하나도 보이지 않는다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: workbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `prisma generate`와 `prisma validate`가 schema.prisma의 `env()` 참조를 풀기 때문에 값이
      # 있어야 한다. 위 서비스 컨테이너를 가리키고, 테스트 단계가 이 DB를 마이그레이션해서 쓴다.
      # DB 이름에 일부러 "test"를 넣었다 — `test/helpers/db.ts`는 모든 테이블을 TRUNCATE하므로
      # "test"가 없는 URL에서는 돌지 않는다.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/workbridge_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/workbridge_test
      # 없으면 vitest.config.ts가 `postgresql://$USER@localhost/workbridge_test`로 대신하는데,
      # 이 컨테이너의 계정과 맞지 않는다.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/workbridge_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbridge-server/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # 타입 체크 전에 Prisma가 생성한 타입이 있어야 한다 — 데이터 모델 전체가 거기서 온다.
      - name: Prisma 클라이언트 생성
        run: npx prisma generate

      - name: 타입 체크
        run: npx tsc --noEmit

      # 타입 기반 규칙(typescript-eslint)이라 Prisma 클라이언트 생성 뒤에 돈다. 기존 `any` 사용은
      # `eslint-suppressions.json`에 기록돼 통과하고, 새로 생기면 실패한다. 기록된 위반을 고쳤으면
      # `npx eslint . --prune-suppressions`로 기록을 줄여 함께 커밋한다.
      - name: 린트
        run: npm run lint

      - name: Prisma 스키마 검증
        run: npx prisma validate

      # `openapi.json`은 zod 스키마에서 생성해 커밋한다. 스키마나 라우트를 바꾸고 다시 생성하지 않았으면
      # 여기서 실패한다 — `npm run openapi`로 만들어 함께 커밋한다. DB와 환경변수 없이 돈다.
      - name: OpenAPI 문서가 최신인지 확인
        run: npm run openapi && git diff --exit-code openapi.json

      - name: 테스트 DB에 마이그레이션 적용
        run: npx prisma migrate deploy

      # schema.prisma만 고치고 마이그레이션을 만들지 않았으면(또는 마이그레이션을 손으로 고쳐 어긋났으면) 실패한다.
      # 마이그레이션을 적용한 DB와 schema.prisma를 비교한다. 고치는 법: `npx prisma migrate dev --name <name>`.
      - name: schema.prisma와 마이그레이션이 맞는지 확인
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: 테스트
        run: npm test

  client:
    name: workbridge-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbridge-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbridge-client/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint -- --max-warnings=0

      # 클라이언트에는 단위 테스트가 없어서 운영 빌드가 깨끗이 끝나는 것이 정합성 검사다
      # (CLAUDE.md). API URL은 요청 때만 읽으므로 어떤 값이든 빌드된다.
      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

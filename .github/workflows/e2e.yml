name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same Postgres-service convention as typecheck.yml. The database is seeded (= wiped) by
    # scripts/e2e.sh; test/helpers/db.ts's "must contain test" guard does not apply here because
    # the E2E suite never loads that helper.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: workbridge_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `prisma generate` resolves the env() references in schema.prisma.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/workbridge_e2e
      DIRECT_URL: postgresql://ci:ci@localhost:5432/workbridge_e2e
      # scripts/e2e.sh builds every server/client variable from these (ports 4002/3002, dummy
      # SUPABASE_URL/SUPABASE_SECRET_KEY/OPENAI_API_KEY, payment bypass on, job worker and rate
      # limit off). CI=true makes it run `next build && next start` instead of `next dev`.
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/workbridge_e2e
      E2E_CLIENT_MODE: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            workbridge-server/package-lock.json
            workbridge-client/package-lock.json

      - name: Install server dependencies
        working-directory: workbridge-server
        run: npm ci

      - name: Install client dependencies
        working-directory: workbridge-client
        run: npm ci

      - name: Generate Prisma client
        working-directory: workbridge-server
        run: npx prisma generate

      - name: Install Chromium for Playwright
        working-directory: workbridge-client
        run: npx playwright install --with-deps chromium

      # Creates the database if missing, `prisma migrate deploy`, `npm run db:seed`, starts the
      # API with tsx on :4002 and the client with `next build && next start` on :3002, waits for
      # both, runs `playwright test`, and always stops both servers.
      - name: Run E2E suite
        run: bash scripts/e2e.sh

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            workbridge-client/playwright-report/
            workbridge-client/test-results/
          retention-days: 14

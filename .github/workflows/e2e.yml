name: e2e

on:
  push:
    branches: [main]
  pull_request:

# PR에 푸시가 이어지면 이전 실행을 취소한다. main 푸시는 끝까지 돈다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ci.yml과 같은 Postgres 서비스 방식. DB는 scripts/e2e.sh가 시드한다(= 비운다).
    # E2E 스위트는 test/helpers/db.ts를 불러오지 않으므로 "이름에 test" 검사는 여기에 해당하지 않는다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: workbridge_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `prisma generate`가 schema.prisma의 env() 참조를 푼다.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/workbridge_e2e
      DIRECT_URL: postgresql://ci:ci@localhost:5432/workbridge_e2e
      # scripts/e2e.sh가 이 값들로 서버·클라이언트 변수를 모두 만든다(포트 4002/3002, 더미
      # SUPABASE_URL/SUPABASE_SECRET_KEY, 결제 우회 켬, 작업 워커와 요청 제한 끔).
      # CI=true면 `next dev` 대신 `next build && next start`로 돈다.
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/workbridge_e2e
      E2E_CLIENT_MODE: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            workbridge-server/package-lock.json
            workbridge-client/package-lock.json

      - name: 서버 의존성 설치
        working-directory: workbridge-server
        run: npm ci

      - name: 클라이언트 의존성 설치
        working-directory: workbridge-client
        run: npm ci

      - name: Prisma 클라이언트 생성
        working-directory: workbridge-server
        run: npx prisma generate

      - name: Playwright용 Chromium 설치
        working-directory: workbridge-client
        run: npx playwright install --with-deps chromium

      # DB가 없으면 만들고, `prisma migrate deploy`, `npm run db:seed`를 돌린 뒤, API를 tsx로 :4002에,
      # 클라이언트를 `next build && next start`로 :3002에 띄우고, 둘 다 뜨기를 기다려 `playwright test`를
      # 돌린다. 끝나면 결과와 상관없이 두 서버를 내린다.
      - name: E2E 스위트 실행
        run: bash scripts/e2e.sh

      - name: Playwright 리포트와 트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            workbridge-client/playwright-report/
            workbridge-client/test-results/
          retention-days: 14

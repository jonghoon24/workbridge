name: typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: workbridge-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbridge-server
    env:
      # `prisma validate` and `prisma generate` resolve the `env()` references in
      # schema.prisma, so these must be *defined* — but nothing here connects to a
      # database, so placeholders are sufficient. Locally these come from .env.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbridge-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prisma's generated types must exist before typecheck — the whole data model
      # is inherited from them.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

name: 명세 불일치
description: docs/BEHAVIOR.md에 적힌 동작과 구현이 다른 것
labels: ["divergence", "server"]
body:
  - type: input
    id: item
    attributes:
      label: BEHAVIOR.md 항목
      description: D번호와 해당 절·규칙 번호. 아직 번호가 없으면 절 이름만.
      placeholder: "D13 — Payments › POST / (PY1, PY2), Cross-cutting rule 8"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 현재 동작
      description: 요청과 실제 응답(상태 코드, 본문), 데이터베이스에 남는 것.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: 명세
      description: BEHAVIOR.md의 해당 문장을 인용한다.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: 고정된 테스트
      description: 이 불일치를 고정한 `it.fails` 테스트의 파일과 이름. 없으면 "없음"과 이유.
      placeholder: "test/payments.test.ts — 'never returns 5xx when two concurrent creates collide on the unique milestoneId [D13]'"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고
      description: 관련 D/Q 번호, 같은 원인을 공유하는 곳.
    validations:
      required: false
